[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dagflow"
version = "0.4.0"
description = "Incremental computation engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AfterQuery", email = "dev@afterquery.com"}]
dependencies = []

[project.scripts]
dagflow = "dagflow.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dagflow = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
